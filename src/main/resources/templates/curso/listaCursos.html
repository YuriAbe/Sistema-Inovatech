<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Cursos — Painel Inovatech', 'Gestão de cursos da instituição.', 'gestão cursos, inovatech')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <header th:replace="~{fragments/layout :: navbarAdmin('cursos')}"></header>

    <main id="conteudo" class="py-4 py-lg-5">
        <div class="container">

            <nav aria-label="Trilha de navegação">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/home}">Painel</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Cursos</li>
                </ol>
            </nav>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                <div>
                    <h1 class="h3 mb-0">Cursos</h1>
                    <p class="text-muted-inv mb-0"><span th:text="${#lists.size(cursos)}">0</span> curso(s) cadastrado(s)</p>
                </div>
                <a class="btn btn-primary" th:href="@{/cursos/criar}">
                    <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Novo curso
                </a>
            </div>

            <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${sucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${erro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="inv-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <caption class="visually-hidden">Lista de cursos cadastrados</caption>
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Nome</th>
                                <th scope="col">Carga horária</th>
                                <th scope="col" class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="curso : ${cursos}">
                                <td class="fw-semibold" th:text="${curso.nomeCurso}">—</td>
                                <td th:text="${curso.cargaHorariaCurso} + ' h'">0 h</td>
                                <td class="text-end text-nowrap">
                                    <a class="btn btn-sm btn-outline-primary"
                                        th:href="@{/cursos/editar/{id}(id=${curso.idCurso})}"
                                        th:aria-label="'Editar ' + ${curso.nomeCurso}">
                                        <i class="bi bi-pencil" aria-hidden="true"></i>
                                    </a>
                                    <a class="btn btn-sm btn-outline-danger"
                                        th:href="@{/cursos/excluir/{id}(id=${curso.idCurso})}"
                                        th:aria-label="'Excluir ' + ${curso.nomeCurso}"
                                        onclick="return confirm('Deseja realmente excluir este curso?');">
                                        <i class="bi bi-trash" aria-hidden="true"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(cursos)}">
                                <td colspan="3" class="text-center text-muted-inv py-4">Nenhum curso cadastrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: vlibras}"></div>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
