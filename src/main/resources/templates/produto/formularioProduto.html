<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Cadastro de Produto — Inovatech', 'Cadastro de produtos da APM.', 'cadastro produto, inovatech')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <header th:replace="~{fragments/layout :: navbarAdmin('produtos')}"></header>

    <main id="conteudo" class="py-4 py-lg-5">
        <div class="container" style="max-width: 720px;">

            <nav aria-label="Trilha de navegação">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/home}">Painel</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/produtos/listar}">Produtos</a></li>
                    <li class="breadcrumb-item active" aria-current="page"
                        th:text="${produto.idProduto != null} ? 'Editar produto' : 'Novo produto'">Novo produto</li>
                </ol>
            </nav>

            <div class="inv-card p-4 p-md-5">
                <h1 class="h3 mb-4" th:text="${produto.idProduto != null} ? 'Editar produto' : 'Cadastro de produto'">Cadastro de produto</h1>

                <form th:action="@{/produtos/salvar}" method="post" th:object="${produto}">
                    <input type="hidden" th:field="*{idProduto}">

                    <div class="mb-3">
                        <label for="descricaoProduto" class="form-label fw-semibold">Descrição</label>
                        <input type="text" class="form-control" id="descricaoProduto"
                            th:field="*{descricaoProduto}"
                            th:classappend="${#fields.hasErrors('descricaoProduto')} ? 'is-invalid'"
                            required minlength="3" maxlength="40" placeholder="Ex.: Camiseta Polo Azul">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descricaoProduto')}" th:errors="*{descricaoProduto}"></div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6 mb-3">
                            <label for="valorProduto" class="form-label fw-semibold">Valor (R$)</label>
                            <input type="number" step="0.01" min="0.01" class="form-control"
                                id="valorProduto" th:field="*{valorProduto}"
                                th:classappend="${#fields.hasErrors('valorProduto')} ? 'is-invalid'"
                                required placeholder="Ex.: 49.90">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('valorProduto')}" th:errors="*{valorProduto}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="marcaProduto" class="form-label fw-semibold">Marca</label>
                            <input type="text" class="form-control" id="marcaProduto"
                                th:field="*{marcaProduto}"
                                th:classappend="${#fields.hasErrors('marcaProduto')} ? 'is-invalid'"
                                required minlength="3" maxlength="30" placeholder="Ex.: Nike">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('marcaProduto')}" th:errors="*{marcaProduto}"></div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="categoria" class="form-label fw-semibold">Categoria</label>
                        <select class="form-select" id="categoria" name="categoria" required>
                            <option value="">Selecione uma categoria</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}"
                                th:text="${cat.nomeCategoria}"
                                th:selected="${produto.categoria != null and produto.categoria.idCategoria == cat.idCategoria}"></option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="imagemUrl" class="form-label fw-semibold">URL da imagem</label>
                        <input type="url" class="form-control" id="imagemUrl" th:field="*{imagemUrl}"
                            placeholder="https://exemplo.com/imagem.jpg">
                        <small class="form-text-helper"><i class="bi bi-info-circle me-1"></i>Cole o link de uma imagem do produto (opcional)</small>
                        <img id="imagemPreview" src="" alt="Preview" class="img-preview" style="display:none;">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Salvar
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/produtos/listar}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: vlibras}"></div>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
    <script th:src="@{/js/validacao.js}"></script>
</body>

</html>
