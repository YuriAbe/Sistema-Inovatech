<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Relatório de Alunos — Inovatech', 'Relatório de alunos cadastrados na instituição.', 'relatório alunos, inovatech')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <header th:replace="~{fragments/layout :: navbarAdmin('relatorios')}"></header>

    <main id="conteudo" class="py-4 py-lg-5">
        <div class="container">

            <nav aria-label="Trilha de navegação">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/home}">Painel</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Relatório de alunos</li>
                </ol>
            </nav>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                <div>
                    <h1 class="h3 mb-0">Relatório de alunos</h1>
                    <p class="text-muted-inv mb-0"><span th:text="${#lists.size(alunos)}">0</span> aluno(s) no relatório</p>
                </div>
                <a class="btn btn-gold" th:href="@{/relatorios/alunos/pdf}" target="_blank" rel="noopener">
                    <i class="bi bi-file-earmark-pdf me-1" aria-hidden="true"></i>Gerar PDF
                </a>
            </div>

            <div class="inv-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <caption class="visually-hidden">Relatório de alunos</caption>
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Nome</th>
                                <th scope="col">E-mail</th>
                                <th scope="col">Telefone</th>
                                <th scope="col">Cidade</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="aluno : ${alunos}">
                                <td class="fw-semibold" th:text="${aluno.nomeAluno}">—</td>
                                <td th:text="${aluno.emailAluno}">—</td>
                                <td th:text="${aluno.telefoneAluno}">—</td>
                                <td th:text="${aluno.cidadeAluno}">—</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(alunos)}">
                                <td colspan="4" class="text-center text-muted-inv py-4">Nenhum aluno cadastrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: vlibras}"></div>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
