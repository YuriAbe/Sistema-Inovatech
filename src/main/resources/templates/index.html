<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Bem-vindo ao Inovatech', 'Portal institucional Inovatech da Associação de Pais e Mestres.', 'inovatech, portal, APM')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <header th:replace="~{fragments/layout :: navbarPublico('home')}"></header>

    <main id="conteudo" class="inv-section">
        <div class="container text-center" style="max-width: 720px;">
            <span class="inv-brand-badge mb-3" style="width:3.5rem;height:3.5rem;font-size:1.6rem" aria-hidden="true">i</span>
            <h1 class="display-5 mb-3">Bem-vindo ao Inovatech</h1>
            <p class="lead text-muted-inv mb-4">
                A plataforma acadêmica institucional da Associação de Pais e Mestres.
            </p>
            <div class="d-flex flex-wrap justify-content-center gap-3">
                <a class="btn btn-primary btn-lg" th:href="@{/}">Ir para a página inicial</a>
                <a class="btn btn-outline-primary btn-lg" th:href="@{/produtos}">Ver produtos</a>
                <a class="btn btn-gold btn-lg" th:href="@{/login}">Acessar o sistema</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: vlibras}"></div>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
