<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Redefinir senha — Inovatech', 'Defina uma nova senha para sua conta Inovatech.', 'redefinir senha, inovatech')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <main id="conteudo" class="inv-auth-wrap">
        <section class="inv-auth-card" aria-labelledby="reset-titulo">
            <a class="d-inline-flex align-items-center gap-2 text-decoration-none mb-4" th:href="@{/}">
                <span class="inv-brand-badge" aria-hidden="true">i</span>
                <span class="fw-bold fs-5" style="color:var(--inv-navy)">Inovatech</span>
            </a>
            <h1 id="reset-titulo" class="h3 mb-1">Redefinir senha</h1>
            <p class="text-muted-inv mb-4">Escolha uma nova senha de acesso.</p>

            <div class="alert alert-danger py-2" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/updatePassword}" method="post">
                <input type="hidden" name="token" th:value="${token}" />

                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-semibold">Nova senha</label>
                    <div class="input-group">
                        <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" required
                            autocomplete="new-password">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold">Confirmar nova senha</label>
                    <div class="input-group">
                        <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                            autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">Redefinir senha</button>
            </form>

            <div class="mt-3 small">
                <a th:href="@{/login}"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar para o login</a>
            </div>
        </section>
    </main>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
