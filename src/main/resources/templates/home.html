<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Painel Administrativo — Inovatech', 'Painel administrativo do Sistema Inovatech.', 'painel, administração, inovatech')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <header th:replace="~{fragments/layout :: navbarAdmin('home')}"></header>

    <main id="conteudo" class="py-4 py-lg-5">
        <div class="container">
            <header class="mb-4">
                <h1 class="h2 mb-1">Painel administrativo</h1>
                <p class="text-muted-inv mb-0">Gerencie as entidades acadêmicas e os produtos da APM.</p>
            </header>

            <div class="row g-4">
                <div class="col-12 col-sm-6 col-lg-4" th:each="item : ${
                    {
                        {'Alunos','Cadastro e gestão de alunos','bi-people','/alunos/listar'},
                        {'Cursos','Gestão de cursos','bi-journal-bookmark','/cursos/listar'},
                        {'Professores','Gestão de professores','bi-person-video3','/professores/listar'},
                        {'Disciplinas','Gestão de disciplinas','bi-card-checklist','/disciplinas/listar'},
                        {'Produtos','Produtos da APM','bi-box-seam','/produtos/listar'},
                        {'Novo pedido','Montar um pedido','bi-cart-plus','/pedidos/criar'},
                        {'Relatórios','Relatórios de alunos','bi-file-earmark-bar-graph','/relatorios/alunos'}
                    }
                }">
                    <a class="inv-card d-block text-decoration-none text-reset p-4" th:href="@{${item[3]}}">
                        <span class="inv-quick-icon mb-3" aria-hidden="true"><i class="bi" th:classappend="${item[2]}"></i></span>
                        <h2 class="h5 mb-1" th:text="${item[0]}">Seção</h2>
                        <p class="small text-muted-inv mb-0" th:text="${item[1]}">Descrição</p>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: vlibras}"></div>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
