<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Esqueci minha senha — Inovatech', 'Recupere o acesso à sua conta Inovatech.', 'recuperar senha, inovatech')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <main id="conteudo" class="inv-auth-wrap">
        <section class="inv-auth-card" aria-labelledby="forgot-titulo">
            <a class="d-inline-flex align-items-center gap-2 text-decoration-none mb-4" th:href="@{/}">
                <span class="inv-brand-badge" aria-hidden="true">i</span>
                <span class="fw-bold fs-5" style="color:var(--inv-navy)">Inovatech</span>
            </a>
            <h1 id="forgot-titulo" class="h3 mb-1">Esqueci minha senha</h1>
            <p class="text-muted-inv mb-4">Informe seu e-mail para receber o link de redefinição.</p>

            <div class="alert alert-danger py-2" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <div class="alert alert-success py-2" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>

            <form th:action="@{/resetPassword}" method="post">
                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text" aria-hidden="true"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" required
                            autocomplete="username" placeholder="voce@email.com">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">Enviar link</button>
            </form>

            <div class="mt-3 small">
                <a th:href="@{/login}"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar para o login</a>
            </div>
        </section>
    </main>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
