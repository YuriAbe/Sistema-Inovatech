<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Pedidos — Painel Inovatech', 'Pedidos realizados na loja da APM.', 'pedidos, inovatech, APM')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <header th:replace="~{fragments/layout :: navbarAdmin('pedidos')}"></header>

    <main id="conteudo" class="py-4 py-lg-5">
        <div class="container">

            <nav aria-label="Trilha de navegação">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/home}">Painel</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Pedidos</li>
                </ol>
            </nav>

            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                <div>
                    <h1 class="h3 mb-0">Pedidos</h1>
                    <p class="text-muted-inv mb-0"><span th:text="${#lists.size(pedidos)}">0</span> pedido(s) realizado(s)</p>
                </div>
                <a class="btn btn-primary" th:href="@{/pedidos/criar}">
                    <i class="bi bi-cart-plus me-1" aria-hidden="true"></i>Novo pedido
                </a>
            </div>

            <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${sucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${erro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="inv-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <caption class="visually-hidden">Lista de pedidos realizados</caption>
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Pedido</th>
                                <th scope="col">Data</th>
                                <th scope="col">Aluno</th>
                                <th scope="col">Itens</th>
                                <th scope="col">Total</th>
                                <th scope="col" class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pedido : ${pedidos}">
                                <td class="fw-semibold" th:text="'#' + ${pedido.idPedido}">#1</td>
                                <td th:text="${pedido.dataPedido != null} ? ${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy')} : '—'">—</td>
                                <td th:text="${pedido.aluno != null} ? ${pedido.aluno.nomeAluno} : '—'">—</td>
                                <td>
                                    <span class="badge text-bg-light"
                                        th:text="${pedido.itens != null ? #lists.size(pedido.itens) : 0} + ' item(ns)'">0 item(ns)</span>
                                </td>
                                <td class="fw-semibold"
                                    th:text="'R$ ' + ${#numbers.formatDecimal(pedido.totalPedido, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                                <td class="text-end text-nowrap">
                                    <a class="btn btn-sm btn-outline-danger"
                                        th:href="@{/pedidos/excluir/{id}(id=${pedido.idPedido})}"
                                        th:aria-label="'Excluir pedido ' + ${pedido.idPedido}"
                                        onclick="return confirm('Deseja realmente excluir este pedido?');">
                                        <i class="bi bi-trash" aria-hidden="true"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pedidos)}">
                                <td colspan="6" class="text-center text-muted-inv py-4">Nenhum pedido realizado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: vlibras}"></div>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
