<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Meu Carrinho — Inovatech', 'Carrinho de compras da APM Inovatech.', 'carrinho, compras, inovatech')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <header th:replace="~{fragments/layout :: navbarPublico('carrinho')}"></header>

    <main id="conteudo" class="py-4 py-lg-5">
        <div class="container" style="max-width: 900px;">

            <nav aria-label="Trilha de navegação">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Início</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/produtos}">Produtos</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Carrinho</li>
                </ol>
            </nav>

            <h1 class="h3 mb-4"><i class="bi bi-cart3 me-2" aria-hidden="true"></i>Meu Carrinho</h1>

            <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${sucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${erro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(itens)}" class="text-center py-5">
                <i class="bi bi-cart-x display-1 text-muted" aria-hidden="true" style="opacity:.3"></i>
                <h2 class="h5 mt-3">Seu carrinho está vazio</h2>
                <p class="text-muted">Adicione produtos da nossa vitrine para começar!</p>
                <a th:href="@{/produtos}" class="btn btn-primary btn-lg">
                    <i class="bi bi-shop me-2" aria-hidden="true"></i>Ver produtos
                </a>
            </div>

            <!-- Cart with items -->
            <div th:if="${!#lists.isEmpty(itens)}">
                <div class="inv-card p-0 overflow-hidden mb-4">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <caption class="visually-hidden">Itens no carrinho</caption>
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">Produto</th>
                                    <th scope="col">Preço</th>
                                    <th scope="col" style="width:120px">Quantidade</th>
                                    <th scope="col">Subtotal</th>
                                    <th scope="col" class="text-end">Ação</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${itens}">
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <img th:src="${item.imagemUrl != null and !item.imagemUrl.isEmpty()} ? ${item.imagemUrl} : @{/images/produto-placeholder.svg}"
                                                 alt="" class="produto-img-thumb"
                                                 onerror="this.src='/images/produto-placeholder.svg'">
                                            <span class="fw-semibold" th:text="${item.descricaoProduto}">Produto</span>
                                        </div>
                                    </td>
                                    <td th:text="'R$ ' + ${#numbers.formatDecimal(item.valorProduto, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                                    <td>
                                        <form th:action="@{/carrinho/atualizar}" method="post" class="d-flex align-items-center gap-1">
                                            <input type="hidden" name="idProduto" th:value="${item.idProduto}">
                                            <input type="number" name="quantidade" th:value="${item.quantidade}"
                                                   min="1" class="form-control form-control-sm" style="width:70px"
                                                   onchange="this.form.submit()">
                                        </form>
                                    </td>
                                    <td class="fw-semibold" th:text="'R$ ' + ${#numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                                    <td class="text-end">
                                        <form th:action="@{/carrinho/remover}" method="post" class="d-inline">
                                            <input type="hidden" name="idProduto" th:value="${item.idProduto}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                                    th:aria-label="'Remover ' + ${item.descricaoProduto}">
                                                <i class="bi bi-trash" aria-hidden="true"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Checkout section -->
                <div class="inv-card p-4">
                    <div class="row align-items-end g-3">
                        <div class="col-md-6">
                            <label for="idAluno" class="form-label fw-semibold">Para qual aluno é este pedido?</label>
                            <select class="form-select" id="idAluno" name="idAluno" form="formFinalizar" required>
                                <option value="">Selecione o aluno</option>
                                <option th:each="a : ${alunos}" th:value="${a.idAluno}" th:text="${a.nomeAluno}"></option>
                            </select>
                            <small class="form-text text-muted"><i class="bi bi-info-circle me-1"></i>Selecione o aluno beneficiado pelo pedido</small>
                        </div>
                        <div class="col-md-3 text-md-end">
                            <p class="h4 mb-0" aria-live="polite">
                                Total: <strong class="inv-preco" th:text="'R$ ' + ${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</strong>
                            </p>
                        </div>
                        <div class="col-md-3">
                            <form id="formFinalizar" th:action="@{/carrinho/finalizar}" method="post">
                                <input type="hidden" name="idAluno" id="idAlunoHidden">
                                <button type="submit" class="btn btn-primary btn-lg w-100" onclick="document.getElementById('idAlunoHidden').value = document.getElementById('idAluno').value">
                                    <i class="bi bi-bag-check me-2" aria-hidden="true"></i>Finalizar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: vlibras}"></div>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
