<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Pedido Confirmado — Inovatech', 'Seu pedido foi realizado com sucesso.', 'pedido confirmado, inovatech')}">
</head>

<body>
    <a th:replace="~{fragments/layout :: skipLink}"></a>
    <header th:replace="~{fragments/layout :: navbarPublico('carrinho')}"></header>

    <main id="conteudo" class="py-5">
        <div class="container text-center" style="max-width: 600px;">
            <div class="inv-card p-5">
                <i class="bi bi-check-circle-fill display-1 text-success mb-3" aria-hidden="true"></i>
                <h1 class="h2 mb-2">Pedido realizado!</h1>
                <p class="text-muted mb-4">Seu pedido foi registrado com sucesso. A APM entrará em contato para combinar a entrega.</p>

                <div th:if="${sucesso}" class="alert alert-success" role="status">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${sucesso}"></span>
                </div>

                <div class="d-flex flex-wrap justify-content-center gap-3 mt-3">
                    <a th:href="@{/produtos}" class="btn btn-primary btn-lg">
                        <i class="bi bi-shop me-2" aria-hidden="true"></i>Continuar comprando
                    </a>
                    <a th:href="@{/}" class="btn btn-outline-primary btn-lg">
                        <i class="bi bi-house me-2" aria-hidden="true"></i>Voltar ao início
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <div th:replace="~{fragments/layout :: vlibras}"></div>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
